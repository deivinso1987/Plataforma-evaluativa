// ---------- Almacenamiento (Google Sheets vía Apps Script) ----------
const KEY_BANK = "eval:bank";
const KEY_EXAMS = "eval:exams";
const KEY_STUDENTS = "eval:students";
const KEY_RESULTS = "eval:results";
const KEY_COURSES = "eval:courses";

// Carga TODAS las claves en una sola llamada (más rápido, menos consumo de datos móviles).
async function loadAllFromSheet() {
  try {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=all`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } catch (e) {
    console.error("No se pudo cargar desde Google Sheets", e);
    return null;
  }
}

// Content-Type text/plain evita el preflight CORS que Apps Script no maneja bien
// (esto es lo que había fallado antes en Mi Lancha con Safari/iPhone).
async function saveShared(key, value) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key, value }),
    });
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function normalize(str) {
  return (str || "").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

// Lee un archivo Excel y devuelve estudiantes nuevos. Si cursoIdFijo se indica, todas las filas
// se asignan a ese curso y no se exige columna "Curso" en el archivo.
function parseStudentsFile(arrayBuffer, { courses, existingCodes, cursoIdFijo }) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
  if (rows.length < 2) return { ok: false, text: "El archivo no tiene filas de datos." };

  const header = rows[0].map((h) => normalize(h));
  const idxCodigo = header.findIndex((h) => h.includes("codigo"));
  const idxNombre = header.findIndex((h) => h.includes("nombre"));
  const idxCurso = header.findIndex((h) => h.includes("curso"));

  if (idxCodigo === -1 || idxNombre === -1) {
    return { ok: false, text: 'El archivo debe tener al menos columnas "Código" y "Nombre".' };
  }
  if (!cursoIdFijo && idxCurso === -1) {
    return { ok: false, text: 'El archivo debe tener también una columna "Curso".' };
  }

  let agregados = 0, duplicados = 0;
  const sinCurso = [];
  const nuevos = [];
  const codigos = new Set(existingCodes);

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    if (!row || row.length === 0) continue;
    const codigo = (row[idxCodigo] ?? "").toString().trim();
    const nombre = (row[idxNombre] ?? "").toString().trim();
    if (!codigo || !nombre) continue;
    if (codigos.has(codigo)) { duplicados++; continue; }

    let cursoId = cursoIdFijo;
    if (!cursoId) {
      const cursoTexto = (row[idxCurso] ?? "").toString().trim();
      const curso = courses.find((c) => normalize(c.nombre) === normalize(cursoTexto));
      if (!curso) { sinCurso.push(`Fila ${i + 1}: curso "${cursoTexto}" no coincide con ninguno registrado`); continue; }
      cursoId = curso.id;
    }

    nuevos.push({ codigo, nombre, cursoId });
    codigos.add(codigo);
    agregados++;
  }

  let text = `${agregados} estudiante(s) importado(s).`;
  if (duplicados > 0) text += ` ${duplicados} ya existían (omitidos).`;
  if (sinCurso.length > 0) text += ` ${sinCurso.length} con curso no reconocido.`;
  return { ok: agregados > 0, text, detalles: sinCurso, nuevos };
}

function ImportStudentsButton({ courses, students, cursoIdFijo, onImported, label }) {
  const fileRef = useRef(null);
  const [msg, setMsg] = useState(null);
  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const result = parseStudentsFile(ev.target.result, {
          courses, existingCodes: students.map((s) => s.codigo), cursoIdFijo,
        });
        if (result.nuevos && result.nuevos.length > 0) onImported(result.nuevos);
        setMsg(result);
      } catch (err) {
        setMsg({ ok: false, text: "No se pudo leer el archivo. Verifique que sea un .xlsx válido." });
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  };
  return (
    <div>
      <button onClick={() => fileRef.current?.click()} className="text-sm bg-teal-700 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-teal-800">
        <Upload className="w-4 h-4" /> {label || "Subir archivo .xlsx"}
      </button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} className="hidden" />
      {msg && (
        <div className={`mt-2 text-xs rounded p-2 ${msg.ok ? "bg-emerald-50 text-emerald-800" : "bg-red-50 text-red-700"}`}>
          <p>{msg.text}</p>
          {msg.detalles && msg.detalles.length > 0 && (
            <ul className="mt-1 list-disc list-inside">{msg.detalles.slice(0, 5).map((d, i) => (<li key={i}>{d}</li>))}</ul>
          )}
        </div>
      )}
    </div>
  );
}

// Comprime una imagen a un ancho máximo antes de guardarla, para no inflar el almacenamiento.
function compressImage(file, maxWidth = 480, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new window.Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function pesoDe(q) {
  return q && typeof q.puntos === "number" && q.puntos > 0 ? q.puntos : 1;
}

// Calcula la nota final escalada de un resultado dado el examen y el banco.
function calcularNota(exam, bank, result) {
  let earned = 0, total = 0, pendientesAbiertas = 0;
  exam.preguntaIds.forEach((qid) => {
    const q = bank.find((x) => x.id === qid);
    if (!q) return;
    const peso = pesoDe(q);
    total += peso;
    if (q.tipo === "mcq") {
      if (result.answers[q.id] === q.correcta) earned += peso;
    } else if (q.tipo === "numerica") {
      const v = parseFloat(result.answers[q.id]);
      if (!isNaN(v) && Math.abs(v - q.valorCorrecto) <= (q.tolerancia || 0)) earned += peso;
    } else if (q.tipo === "abierta") {
      const g = result.openGrades ? result.openGrades[q.id] : undefined;
      if (g === undefined) pendientesAbiertas += 1;
      else earned += g * peso;
    }
  });
  const escala = exam.escala || 5;
  const notaEscalada = total > 0 ? (earned / total) * escala : 0;
  return { earned, total, notaEscalada, escala, pendientesAbiertas };
}

function App() {
  const [role, setRole] = useState(null);

  const [students, setStudents] = useState([]);
  const [results, setResults] = useState([]);

  const [loadError, setLoadError] = useState(false);

  useEffect(() => {
    (async () => {
      const all = await loadAllFromSheet();
      if (all === null) {
        setLoadError(true);
        setLoading(false);
        return;
      }
      setCourses(all[KEY_COURSES] && all[KEY_COURSES].length ? all[KEY_COURSES] : seedCourses);
      setBank(all[KEY_BANK] && all[KEY_BANK].length ? all[KEY_BANK] : seedQuestions);
      setExams(all[KEY_EXAMS] || []);
      setStudents(all[KEY_STUDENTS] && all[KEY_STUDENTS].length ? all[KEY_STUDENTS] : seedStudents);
      setResults(all[KEY_RESULTS] || []);
      setLoading(false);
    })();
  }, []);

  const persistCourses = async (next) => { setCourses(next); await saveShared(KEY_COURSES, next); };
  const persistBank = async (next) => { setBank(next); await saveShared(KEY_BANK, next); };
  const persistExams = async (next) => { setExams(next); await saveShared(KEY_EXAMS, next); };
  const persistStudents = async (next) => { setStudents(next); await saveShared(KEY_STUDENTS, next); };
  const persistResults = async (next) => { setResults(next); await saveShared(KEY_RESULTS, next); };

  if (loading) {
    return <div className="min-h-[500px] flex items-center justify-center bg-teal-50"><div className="text-teal-800 text-sm">Cargando plataforma…</div></div>;
  }
  if (loadError) {
    return (
      <div className="min-h-[500px] flex items-center justify-center bg-teal-50 p-6">
        <div className="max-w-sm bg-white border border-red-200 rounded-xl p-5 text-center">

        </div>
      </div>
    );
  }
  if (!role) return <RoleSelect onSelect={setRole} />;
  if (role === "teacher") {
    return (
      <TeacherDashboard
        courses={courses} setCourses={persistCourses}
        bank={bank} setBank={persistBank}
        exams={exams} setExams={persistExams}
        students={students} setStudents={persistStudents}
        results={results} setResults={persistResults}
        onExit={() => setRole(null)}
      />
    );
  }
  return (
    <StudentFlow
      courses={courses} bank={bank} exams={exams} students={students}
      results={results} setResults={persistResults}
      onExit={() => setRole(null)}
    />
  );
}

function CourseManager({ courses, setCourses, bank, students, setStudents, exams }) {
  const [nombre, setNombre] = useState("");

  const [editingNombre, setEditingNombre] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  const add = () => { if (!nombre.trim()) return; setCourses([...courses, { id: uid(), nombre: nombre.trim() }]); setNombre(""); };
  const remove = (id) => {
    const enUso = bank.some((q) => q.cursoId === id) || students.some((s) => s.cursoId === id) || exams.some((e) => e.cursoId === id);
    if (enUso && !window.confirm("Este curso tiene preguntas, estudiantes o exámenes asociados. ¿Eliminar de todas formas?")) return;
    setCourses(courses.filter((c) => c.id !== id));
  };
  const startEdit = (c) => { setEditingId(c.id); setEditingNombre(c.nombre); };
  const saveEdit = () => { setCourses(courses.map((c) => (c.id === editingId ? { ...c, nombre: editingNombre.trim() || c.nombre } : c))); setEditingId(null); };
  const countFor = (id) => ({
    preguntas: bank.filter((q) => q.cursoId === id).length,
    estudiantes: students.filter((s) => s.cursoId === id).length,
    examenes: exams.filter((e) => e.cursoId === id).length,
  });

  return (
    <div>
      <h3 className="font-semibold text-teal-900 mb-3">Cursos</h3>
      <div className="flex gap-2 mb-4">
        <input value={nombre} onChange={(e) => setNombre(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Nombre del curso (ej. Álgebra Lineal)" className="flex-1 border border-teal-300 rounded-lg px-3 py-2 text-sm" />
        <button onClick={add} className="bg-teal-800 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-1 hover:bg-teal-900"><Plus className="w-4 h-4" /> Agregar curso</button>
      </div>
      <div className="space-y-2">
        {courses.length === 0 && <p className="text-sm text-teal-500">No hay cursos creados todavía.</p>}
        {courses.map((c) => {
          const n = countFor(c.id);
          const isOpen = expandedId === c.id;
          return (
            <div key={c.id} className="bg-white border border-teal-200 rounded-lg overflow-hidden">
              <div className="p-3 flex items-center justify-between gap-2">
                {editingId === c.id ? (
                  <input value={editingNombre} onChange={(e) => setEditingNombre(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveEdit()} className="flex-1 border border-teal-300 rounded px-2 py-1 text-sm" autoFocus />
                ) : (
                  <div><p className="font-medium text-teal-900">{c.nombre}</p><p className="text-xs text-teal-500">{n.preguntas} preguntas · {n.estudiantes} estudiantes · {n.examenes} exámenes</p></div>
                )}
                <div className="flex gap-1 shrink-0">
                  <button onClick={() => setExpandedId(isOpen ? null : c.id)} className="text-xs px-2 py-1.5 rounded-lg text-teal-700 hover:bg-teal-50 flex items-center gap-1">
                    <Users className="w-3.5 h-3.5" /> Estudiantes
                  </button>
                  {editingId === c.id ? (
                    <button onClick={saveEdit} className="p-1.5 text-teal-700 hover:bg-teal-100 rounded"><Check className="w-4 h-4" /></button>
                  ) : (
                    <button onClick={() => startEdit(c)} className="p-1.5 text-teal-600 hover:bg-teal-100 rounded"><Pencil className="w-4 h-4" /></button>
                  )}
                  <button onClick={() => remove(c.id)} className="p-1.5 text-red-500 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>
                </div>

  if (tipo === "numerica") return { ...base, valorCorrecto: 0, tolerancia: 0 };

                  {q.opciones.map((op, i) => (
                    <li key={i} className={i === q.correcta ? "font-semibold text-teal-800" : ""}>
                      {String.fromCharCode(97 + i)}) {op.texto || "(vacía)"} {op.imagen && "🖼"} {i === q.correcta && "✓"}
                    </li>
                  ))}
                </ul>
              )}
              {q.tipo === "numerica" && <p className="mt-1 text-xs text-teal-600">Respuesta: {q.valorCorrecto} ± {q.tolerancia}</p>}
            </div>
            <div className="flex gap-1 shrink-0">
              <button onClick={() => setEditing(q)} className="p-1.5 text-teal-600 hover:bg-teal-100 rounded"><Pencil className="w-4 h-4" /></button>
              <button onClick={() => deleteQuestion(q.id)} className="p-1.5 text-red-500 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TipoBadge({ tipo }) {
  const map = {
    mcq: ["Selección múltiple", "bg-teal-100 text-teal-800"],
    numerica: ["Numérica", "bg-amber-100 text-amber-800"],
    abierta: ["Abierta", "bg-slate-200 text-slate-700"],
  };
  const [label, cls] = map[tipo] || ["", ""];
  return <span className={`text-[11px] px-2 py-0.5 rounded-full font-medium ${cls}`}>{label}</span>;
}

function ImageUploader({ image, onChange, label }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setBusy(true);
    try {
      const dataUrl = await compressImage(file);
      onChange(dataUrl);
    } catch (err) {
      console.error(err);
    }
    setBusy(false);
    e.target.value = "";
  };
  return (
    <div>
      {image ? (
        <div className="relative inline-block">
          <img src={image} alt="" className="max-h-24 rounded border border-teal-300" />
          <button type="button" onClick={() => onChange(null)} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5"><XIcon className="w-3 h-3" /></button>
        </div>
      ) : (
        <button type="button" onClick={() => inputRef.current?.click()} disabled={busy} className="flex items-center gap-1 text-xs border border-dashed border-teal-300 rounded-lg px-2 py-1.5 text-teal-600 hover:bg-teal-50">
          <ImageIcon className="w-3.5 h-3.5" /> {busy ? "Cargando…" : (label || "Agregar imagen")}
        </button>
      )}
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} className="hidden" />
    </div>
  );
}

function QuestionEditor({ courses, question, onSave, onCancel }) {
  const [q, setQ] = useState(question);
  const updateOpcion = (i, patch) => {
    const ops = q.opciones.map((op, idx) => (idx === i ? { ...op, ...patch } : op));
    setQ({ ...q, opciones: ops });
  };
  const canSave = q.enunciado.trim().length > 0 && q.cursoId;

  return (
    <div className="bg-white border-2 border-teal-300 rounded-xl p-4 mb-2">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
        <div>
          <label className="text-xs font-medium text-teal-700">Curso</label>
          <select value={q.cursoId} onChange={(e) => setQ({ ...q, cursoId: e.target.value })} className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm bg-white">
            <option value="">Seleccione un curso…</option>
            {courses.map((c) => (<option key={c.id} value={c.id}>{c.nombre}</option>))}
          </select>
        </div>
        <div>
          <label className="text-xs font-medium text-teal-700">Tema (subdivisión)</label>
          <input value={q.tema} onChange={(e) => setQ({ ...q, tema: e.target.value })} placeholder="Ej. Álgebra" className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label className="text-xs font-medium text-teal-700">Puntos (vacío = mismo peso)</label>
          <input
            type="number" min="0" step="any"
            value={q.puntos ?? ""}
            onChange={(e) => setQ({ ...q, puntos: e.target.value === "" ? null : parseFloat(e.target.value) })}
            placeholder="1"
            className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm"
          />
        </div>
      </div>

      <label className="text-xs font-medium text-teal-700">Enunciado</label>
      <textarea value={q.enunciado} onChange={(e) => setQ({ ...q, enunciado: e.target.value })} rows={2} className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm mb-2" placeholder="Escriba la pregunta…" />
      <div className="mb-3"><ImageUploader image={q.imagen} onChange={(img) => setQ({ ...q, imagen: img })} label="Imagen del enunciado" /></div>

      {q.tipo === "mcq" && (
        <div className="space-y-3 mb-3">
          <label className="text-xs font-medium text-teal-700">Opciones (marque la correcta)</label>
          {q.opciones.map((op, i) => (
            <div key={i} className="flex items-start gap-2 border border-teal-100 rounded-lg p-2">
              <button type="button" onClick={() => setQ({ ...q, correcta: i })} className={`shrink-0 mt-1 w-6 h-6 rounded-full border-2 flex items-center justify-center ${q.correcta === i ? "bg-teal-700 border-teal-700" : "border-teal-300"}`} title="Marcar como correcta">
                {q.correcta === i && <Check className="w-4 h-4 text-white" />}
              </button>
              <div className="flex-1 space-y-1.5">
                <input value={op.texto} onChange={(e) => updateOpcion(i, { texto: e.target.value })} placeholder={`Opción ${String.fromCharCode(97 + i)}`} className="w-full border border-teal-300 rounded-lg px-3 py-1.5 text-sm" />
                <ImageUploader image={op.imagen} onChange={(img) => updateOpcion(i, { imagen: img })} label="Imagen de la opción" />
              </div>
            </div>
          ))}
        </div>
      )}

      {q.tipo === "numerica" && (
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="text-xs font-medium text-teal-700">Valor correcto</label>
            <input type="number" step="any" value={q.valorCorrecto} onChange={(e) => setQ({ ...q, valorCorrecto: parseFloat(e.target.value) || 0 })} className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label className="text-xs font-medium text-teal-700">Tolerancia (±)</label>
            <input type="number" step="any" min="0" value={q.tolerancia} onChange={(e) => setQ({ ...q, tolerancia: parseFloat(e.target.value) || 0 })} className="w-full mt-1 border border-teal-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>
      )}

      {q.tipo === "abierta" && <p className="text-xs text-teal-500 mb-3">Esta pregunta se califica manualmente después de que el estudiante responde.</p>}

      <div className="flex justify-end gap-2">
        <button onClick={onCancel} className="text-sm px-3 py-1.5 rounded-lg text-teal-600 hover:bg-teal-50">Cancelar</button>
        <button disabled={!canSave} onClick={() => onSave(q)} className="text-sm px-4 py-1.5 rounded-lg bg-teal-800 text-white disabled:opacity-40 hover:bg-teal-900 flex items-center gap-1"><Save className="w-4 h-4" /> Guardar</button>
      </div>
    </div>
  );
}

// ---- Exámenes ----
function ExamManager({ courses, bank, exams, setExams }) {
  const [creating, setCreating] = useState(null);
  const startNew = () => setCreating({
    id: uid(), titulo: "", cursoId: courses[0]?.id || "", preguntaIds: [],
    tiempoMin: 20, bloqueoAvance: true, escala: 5, mostrarResultadoInmediato: true, resultadosPublicados: false,
  });
  const save = (exam) => {
    const exists = exams.some((x) => x.id === exam.id);
    setExams(exists ? exams.map((x) => (x.id === exam.id ? exam : x)) : [...exams, exam]);
    setCreating(null);
  };
  const remove = (id) => setExams(exams.filter((x) => x.id !== id));
  const nameCurso = (id) => courses.find((c) => c.id === id)?.nombre || "(sin curso)";

  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h3 className="font-semibold text-teal-900">Exámenes</h3>
        <button onClick={startNew} disabled={courses.length === 0} className="text-sm bg-teal-800 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 hover:bg-teal-900 disabled:opacity-40"><Plus className="w-4 h-4" /> Crear examen</button>
      </div>
      {courses.length === 0 && <p className="text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3">Cree al menos un curso antes de armar un examen.</p>}
      {creating && <ExamEditor courses={courses} bank={bank} exam={creating} onSave={save} onCancel={() => setCreating(null)} />}
      <div className="space-y-2 mt-4">
        {exams.length === 0 && <p className="text-sm text-teal-500">Aún no ha creado exámenes.</p>}
        {exams.map((ex) => (
          <div key={ex.id} className="bg-white border border-teal-200 rounded-lg p-3 flex items-center justify-between">
            <div>
              <p className="font-medium text-teal-900">{ex.titulo || "(sin título)"}</p>
              <p className="text-xs text-teal-500">
                {nameCurso(ex.cursoId)} · {ex.preguntaIds.length} preguntas · {ex.tiempoMin} min · escala /{ex.escala || 5} · {ex.bloqueoAvance ? "Avance bloqueado" : "Avance libre"} · {ex.mostrarResultadoInmediato ? "Resultado inmediato" : "Resultado oculto hasta publicar"}
              </p>
            </div>
            <div className="flex gap-1">
              <button onClick={() => setCreating(ex)} className="p-1.5 text-teal-600 hover:bg-teal-100 rounded"><Pencil className="w-4 h-4" /></button>
              <button onClick={() => remove(ex.id)} className="p-1.5 text-red-500 hover:bg-red-50 rounded"><Trash2 className="w-4 h-4" /></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function StudentManager({ courses, students, setStudents }) {

  const add = () => {
    if (!codigo.trim() || !nombre.trim() || !cursoId) return;
    if (students.some((s) => s.codigo === codigo.trim())) return;
    setStudents([...students, { codigo: codigo.trim(), nombre: nombre.trim(), cursoId }]);
    setCodigo(""); setNombre("");
  };
  const remove = (c) => setStudents(students.filter((s) => s.codigo !== c));
  const nameCurso = (id) => courses.find((c) => c.id === id)?.nombre || "(sin curso)";

  return (
    <div>
      <h3 className="font-semibold text-teal-900 mb-3">Estudiantes autorizados (todos los cursos)</h3>

      <div className="bg-teal-50 border border-teal-200 rounded-lg p-3 mb-4">

        <ImportStudentsButton
          courses={courses}

// ---- Resultados ----
function ResultsPanel({ courses, bank, exams, setExams, students, results, setResults }) {
  const nameFor = (codigo) => students.find((s) => s.codigo === codigo)?.nombre || codigo;
  const examFor = (id) => exams.find((e) => e.id === id);
  const nameCurso = (id) => courses.find((c) => c.id === id)?.nombre || "";

  const gradeOpen = (resultId, questionId, grade) => {
    setResults(results.map((r) => (r.id === resultId ? { ...r, openGrades: { ...(r.openGrades || {}), [questionId]: grade } } : r)));
  };
  const publicar = (examId) => setExams(exams.map((e) => (e.id === examId ? { ...e, resultadosPublicados: true } : e)));
  const despublicar = (examId) => setExams(exams.map((e) => (e.id === examId ? { ...e, resultadosPublicados: false } : e)));

  // Agrupar por examen para poder ofrecer el botón de publicar una sola vez por examen.
  const examenesConResultados = Array.from(new Set(results.map((r) => r.examId))).map((id) => examFor(id)).filter(Boolean);

  return (
    <div>
      <h3 className="font-semibold text-teal-900 mb-3">Resultados</h3>

        <div className="mb-4 space-y-2">
          {examenesConResultados.filter((ex) => !ex.mostrarResultadoInmediato).map((ex) => {
            const presentaciones = results.filter((r) => r.examId === ex.id).length;
            return (
              <div key={ex.id} className="bg-amber-50 border border-amber-200 rounded-lg p-3 flex items-center justify-between flex-wrap gap-2">
                <div>
                  <p className="text-sm font-medium text-amber-900">{ex.titulo}</p>
                  <p className="text-xs text-amber-700">{presentaciones} presentación(es) · Resultados {ex.resultadosPublicados ? "publicados" : "ocultos para los estudiantes"}</p>
                </div>
                {ex.resultadosPublicados ? (
                  <button onClick={() => despublicar(ex.id)} className="text-xs bg-white border border-amber-400 text-amber-800 px-3 py-1.5 rounded-lg hover:bg-amber-100 flex items-center gap-1"><EyeOff className="w-3.5 h-3.5" /> Ocultar de nuevo</button>
                ) : (
                  <button onClick={() => publicar(ex.id)} className="text-xs bg-amber-600 text-white px-3 py-1.5 rounded-lg hover:bg-amber-700 flex items-center gap-1"><Megaphone className="w-3.5 h-3.5" /> Publicar resultados</button>
                )}
              </div>
            );
          })}
        </div>
      )}

      {results.length === 0 && <p className="text-sm text-teal-500">Todavía no hay presentaciones.</p>}
      <div className="space-y-3">
        {results.slice().reverse().map((r) => {
          const exam = examFor(r.examId);
          if (!exam) return null;
          const openQs = exam.preguntaIds.map((qid) => bank.find((q) => q.id === qid)).filter((q) => q && q.tipo === "abierta");
          const { earned, total, notaEscalada, escala, pendientesAbiertas } = calcularNota(exam, bank, r);

          return (
            <div key={r.id} className="bg-white border border-teal-200 rounded-lg p-3">
              <div className="flex items-center justify-between flex-wrap gap-2">
                <div>
                  <p className="font-medium text-teal-900">{nameFor(r.studentCode)} <span className="text-teal-400 font-normal">({r.studentCode})</span></p>
                  <p className="text-xs text-teal-500">{nameCurso(exam.cursoId)} · {exam.titulo} · {new Date(r.submittedAt).toLocaleString("es-CO")}</p>
                </div>
                <div className="text-right">
                  <p className="text-sm font-semibold text-teal-800">{earned.toFixed(2)}/{total} pts → {notaEscalada.toFixed(2)} / {escala}</p>
                  {pendientesAbiertas > 0 && <p className="text-xs text-amber-600">{pendientesAbiertas} abierta(s) pendiente(s) de calificar</p>}
                  {r.salidas > 0 && <p className="text-xs text-red-600 flex items-center gap-1 justify-end"><AlertCircle className="w-3 h-3" /> {r.salidas} cambio(s) de pantalla detectado(s)</p>}
                </div>
              </div>

              {openQs.length > 0 && (
                <div className="mt-2 border-t border-teal-100 pt-2 space-y-2">
                  {openQs.map((q) => (
                    <div key={q.id} className="text-sm">
                      <p className="text-teal-700 font-medium">{q.enunciado} <span className="text-amber-600 text-xs">({pesoDe(q)}pt)</span></p>
                      <p className="text-teal-900 bg-teal-50 rounded p-2 mt-1">{r.answers[q.id] || <em className="text-teal-400">Sin respuesta</em>}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <span className="text-xs text-teal-500">Calificación (0 a 1, fracción del puntaje de la pregunta):</span>
                        <input type="number" min="0" max="1" step="0.1" defaultValue={r.openGrades?.[q.id] ?? ""} onBlur={(e) => {
                          const v = e.target.value === "" ? undefined : Math.max(0, Math.min(1, parseFloat(e.target.value)));
                          if (v !== undefined) gradeOpen(r.id, q.id, v);
                        }} className="border border-teal-300 rounded px-2 py-0.5 text-sm w-20" />
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- ESTUDIANTE ----------
function StudentFlow({ courses, bank, exams, students, results, setResults, onExit }) {
  const [code, setCode] = useState("");
  const [loggedStudent, setLoggedStudent] = useState(null);
  const [error, setError] = useState("");
  const [activeExam, setActiveExam] = useState(null);
  const [finished, setFinished] = useState(null);

  const login = () => {
    const s = students.find((st) => st.codigo === code.trim());
    if (!s) { setError("Código no encontrado. Verifique con su docente."); return; }
    setError(""); setLoggedStudent(s);
  };
  const nameCurso = (id) => courses.find((c) => c.id === id)?.nombre || "";

  if (finished) {
    return <ExamSummary exam={finished.exam} bank={bank} result={finished.result} onDone={() => { setFinished(null); setActiveExam(null); }} />;
  }
  if (activeExam) {
    return (
      <ExamRunner
        exam={activeExam} bank={bank} student={loggedStudent}
        onSubmit={async (result) => {
          const next = [...results, result];
          await setResults(next);
          setFinished({ exam: activeExam, result });
        }}
        onExit={() => setActiveExam(null)}
      />
    );
  }

  if (!loggedStudent) {
    return (
      <div className="min-h-[520px] bg-teal-50 flex items-center justify-center p-6">
        <div className="max-w-sm w-full bg-white rounded-xl border border-teal-200 p-6">
          <button onClick={onExit} className="text-xs text-teal-500 hover:text-teal-700 mb-4 flex items-center gap-1"><ChevronLeft className="w-3 h-3" /> Volver</button>
          <img src={UDC_LOGO} alt="Universidad de Cartagena" className="h-10 mb-4" />
          <h2 className="text-lg font-bold text-teal-900 mb-1">Ingreso de estudiante</h2>
          <p className="text-sm text-teal-600 mb-4">Escriba su código para acceder a sus pruebas.</p>
          <input value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={(e) => e.key === "Enter" && login()} placeholder="Código de estudiante" className="w-full border border-teal-300 rounded-lg px-3 py-2.5 text-sm mb-2" autoFocus />
          {error && <p className="text-xs text-red-600 mb-2 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" />{error}</p>}
          <button onClick={login} className="w-full bg-teal-800 text-white rounded-lg py-2.5 font-medium hover:bg-teal-900">Ingresar</button>
        </div>
      </div>
    );
  }

  const misResultados = results.filter((r) => r.studentCode === loggedStudent.codigo);
  const yaPresentados = new Set(misResultados.map((r) => r.examId));
  const available = exams.filter((e) => e.cursoId === loggedStudent.cursoId && !yaPresentados.has(e.id));

  return (
    <div className="min-h-[520px] bg-teal-50 p-6">
      <div className="flex items-center justify-between mb-6">
        <div>
          <p className="text-sm text-teal-500">Bienvenido(a) · {nameCurso(loggedStudent.cursoId)}</p>
          <h2 className="text-lg font-bold text-teal-900">{loggedStudent.nombre}</h2>
        </div>
        <button onClick={() => setLoggedStudent(null)} className="text-sm text-teal-600 hover:text-teal-800 flex items-center gap-1"><LogOut className="w-4 h-4" /> Salir</button>
      </div>

      <h3 className="text-sm font-semibold text-teal-700 mb-2">Pruebas disponibles</h3>
      {available.length === 0 && <p className="text-sm text-teal-500 mb-4">No tiene pruebas pendientes por presentar.</p>}
      <div className="space-y-2 mb-6">
        {available.map((e) => (
          <div key={e.id} className="bg-white border border-teal-200 rounded-lg p-3 flex items-center justify-between">
            <div>
              <p className="font-medium text-teal-900">{e.titulo}</p>
              <p className="text-xs text-teal-500">{e.preguntaIds.length} preguntas · {e.tiempoMin} min · sobre {e.escala || 5}</p>
            </div>
            <button onClick={() => setActiveExam(e)} className="bg-teal-800 text-white text-sm px-4 py-2 rounded-lg hover:bg-teal-900">Iniciar</button>
          </div>
        ))}
      </div>

      {misResultados.length > 0 && (
        <>
          <h3 className="text-sm font-semibold text-teal-700 mb-2">Mis resultados</h3>
          <div className="space-y-2">
            {misResultados.map((r) => {
              const exam = exams.find((e) => e.id === r.examId);
              if (!exam) return null;
              const visible = exam.mostrarResultadoInmediato || exam.resultadosPublicados;
              const { notaEscalada, escala, pendientesAbiertas } = calcularNota(exam, bank, r);
              return (
                <div key={r.id} className="bg-white border border-teal-200 rounded-lg p-3 flex items-center justify-between">
                  <p className="text-sm text-teal-900">{exam.titulo}</p>
                  {visible ? (
                    <p className="text-sm font-semibold text-teal-800">{notaEscalada.toFixed(2)} / {escala}{pendientesAbiertas > 0 ? " (provisional)" : ""}</p>
                  ) : (
                    <p className="text-xs text-amber-600 flex items-center gap-1"><EyeOff className="w-3.5 h-3.5" /> Pendiente de publicación</p>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function WatermarkOverlay({ text }) {
  const tiles = Array.from({ length: 24 });
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none z-10" aria-hidden="true">
      <div className="grid grid-cols-3 gap-8 p-4 opacity-[0.06] rotate-[-20deg] scale-125">
        {tiles.map((_, i) => (
          <span key={i} className="text-teal-900 text-xs font-medium whitespace-nowrap">{text}</span>
        ))}
      </div>
    </div>
  );
}

function ExamRunner({ exam, bank, student, onSubmit, onExit }) {
  const questions = exam.preguntaIds.map((id) => bank.find((q) => q.id === id)).filter(Boolean);
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [secondsLeft, setSecondsLeft] = useState(exam.tiempoMin * 60);
  const [salidas, setSalidas] = useState(0);
  const submittedRef = useRef(false);
  const salidasRef = useRef(0);

  const doSubmit = useCallback(() => {
    if (submittedRef.current) return;
    submittedRef.current = true;
    const result = { id: uid(), studentCode: student.codigo, examId: exam.id, answers, openGrades: {}, submittedAt: Date.now(), salidas: salidasRef.current };
    onSubmit(result);
  }, [answers, exam, student, onSubmit]);

  useEffect(() => {
    if (secondsLeft <= 0) { doSubmit(); return; }
    const t = setTimeout(() => setSecondsLeft((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [secondsLeft, doSubmit]);

  // Medidas para dificultar copiar el texto y detectar cuando el estudiante sale de la pestaña.
  // Importante: esto NO puede impedir capturas de pantalla ni fotos tomadas con otro dispositivo;
  // eso no es técnicamente posible desde una página web. Lo que sí logra es desincentivar el copiado
  // de texto y dejar un registro (visible para el docente) de cuántas veces el estudiante cambió
  // de pestaña o de aplicación durante la prueba.
  useEffect(() => {
    const blockCopy = (e) => e.preventDefault();
    const blockContext = (e) => e.preventDefault();
    const blockKeys = (e) => {
      const k = e.key?.toLowerCase();
      const combo = (e.ctrlKey || e.metaKey) && ["c", "x", "u", "s", "p"].includes(k);
      if (combo || e.key === "F12" || (e.ctrlKey && e.shiftKey && ["i", "j", "c"].includes(k))) {
        e.preventDefault();
      }
    };
    const onVisibility = () => {
      if (document.hidden) { salidasRef.current += 1; setSalidas(salidasRef.current); }
    };
    document.addEventListener("copy", blockCopy);
    document.addEventListener("cut", blockCopy);
    document.addEventListener("contextmenu", blockContext);
    document.addEventListener("keydown", blockKeys);
    document.addEventListener("visibilitychange", onVisibility);
    return () => {
      document.removeEventListener("copy", blockCopy);
      document.removeEventListener("cut", blockCopy);
      document.removeEventListener("contextmenu", blockContext);
      document.removeEventListener("keydown", blockKeys);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);

  const q = questions[idx];
  const answered = answers[q.id] !== undefined && answers[q.id] !== "";
  const canAdvance = !exam.bloqueoAvance || answered;
  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");
  const urgent = secondsLeft <= 60;
  const marca = `${student.nombre} · ${student.codigo}`;

  return (
    <div className="min-h-[520px] bg-teal-50 flex flex-col select-none" style={{ userSelect: "none" }}>
      <div className="bg-teal-900 text-white px-5 py-3 flex items-center justify-between">
        <span className="font-medium text-sm truncate">{exam.titulo}</span>
        <span className={`font-mono text-sm px-2 py-0.5 rounded flex items-center gap-1 ${urgent ? "bg-red-500" : "bg-teal-700"}`}><Clock className="w-4 h-4" /> {mm}:{ss}</span>
      </div>
      {salidas > 0 && (
        <div className="bg-amber-100 text-amber-800 text-xs px-5 py-1.5 flex items-center gap-1">
          <AlertCircle className="w-3.5 h-3.5" /> Se detectó que salió de esta pantalla {salidas} {salidas === 1 ? "vez" : "veces"}. Esto queda registrado para el docente.
        </div>
      )}
      <div className="px-5 pt-3">
        <div className="w-full bg-teal-200 rounded-full h-1.5 mb-4"><div className="bg-teal-700 h-1.5 rounded-full transition-all" style={{ width: `${((idx + 1) / questions.length) * 100}%` }} /></div>
        <p className="text-xs text-teal-500 mb-2">Pregunta {idx + 1} de {questions.length}</p>
      </div>
      <div className="flex-1 px-5 relative">
        <WatermarkOverlay text={marca} />
        <div className="bg-white rounded-xl border border-teal-200 p-5 relative">
          <div className="mb-3 flex items-center gap-2"><TipoBadge tipo={q.tipo} /><span className="text-xs text-amber-600 font-medium">{pesoDe(q)} pt{pesoDe(q) !== 1 ? "s" : ""}</span></div>
          <p className="text-teal-900 font-medium mb-3">{q.enunciado}</p>
          {q.imagen && <img src={q.imagen} alt="" className="mb-4 max-h-56 rounded-lg border border-teal-200" draggable={false} />}

          {q.tipo === "mcq" && (
            <div className="space-y-2">
              {q.opciones.map((op, i) => (
                <button key={i} onClick={() => setAnswers({ ...answers, [q.id]: i })} className={`w-full text-left px-4 py-2.5 rounded-lg border text-sm flex items-center gap-2 ${answers[q.id] === i ? "border-teal-700 bg-teal-50 text-teal-900" : "border-teal-200 hover:bg-teal-50"}`}>
                  {answers[q.id] === i ? <CheckCircle2 className="w-4 h-4 text-teal-700 shrink-0" /> : <Circle className="w-4 h-4 text-teal-300 shrink-0" />}
                  <span className="flex-1">
                    {op.texto}
                    {op.imagen && <img src={op.imagen} alt="" className="mt-1 max-h-24 rounded border border-teal-200" draggable={false} />}
                  </span>
                </button>
              ))}
            </div>
          )}
          {q.tipo === "numerica" && (
            <input type="number" step="any" value={answers[q.id] ?? ""} onChange={(e) => setAnswers({ ...answers, [q.id]: e.target.value })} placeholder="Escriba un número" className="w-full border border-teal-300 rounded-lg px-3 py-2.5 text-sm" style={{ userSelect: "text" }} />
          )}
          {q.tipo === "abierta" && (
            <textarea value={answers[q.id] ?? ""} onChange={(e) => setAnswers({ ...answers, [q.id]: e.target.value })} rows={4} placeholder="Escriba su respuesta…" className="w-full border border-teal-300 rounded-lg px-3 py-2.5 text-sm" style={{ userSelect: "text" }} />
          )}
        </div>
      </div>
      <div className="px-5 py-4 flex items-center justify-between">
        <button onClick={() => setIdx((i) => Math.max(0, i - 1))} disabled={idx === 0} className="text-sm px-3 py-2 rounded-lg text-teal-700 disabled:opacity-30 flex items-center gap-1"><ChevronLeft className="w-4 h-4" /> Anterior</button>
        {idx < questions.length - 1 ? (
          <button onClick={() => setIdx((i) => i + 1)} disabled={!canAdvance} title={!canAdvance ? "Debe responder para continuar" : ""} className="text-sm px-4 py-2 rounded-lg bg-teal-800 text-white disabled:opacity-40 flex items-center gap-1 hover:bg-teal-900">Siguiente <ChevronRight className="w-4 h-4" /></button>
        ) : (
          <button onClick={doSubmit} disabled={!canAdvance} className="text-sm px-4 py-2 rounded-lg bg-emerald-700 text-white disabled:opacity-40 hover:bg-emerald-800">Entregar examen</button>
        )}
      </div>
    </div>
  );
}

function ExamSummary({ exam, bank, result, onDone }) {
  const visible = exam.mostrarResultadoInmediato || exam.resultadosPublicados;
  const { notaEscalada, escala, pendientesAbiertas } = calcularNota(exam, bank, result);
  return (
    <div className="min-h-[520px] bg-teal-50 flex items-center justify-center p-6">
      <div className="max-w-sm w-full bg-white rounded-xl border border-teal-200 p-6 text-center">
        <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-emerald-100 mb-4"><CheckCircle2 className="w-7 h-7 text-emerald-700" /></div>
        <h2 className="text-lg font-bold text-teal-900 mb-1">Examen entregado</h2>
        <p className="text-sm text-teal-600 mb-4">Su prueba fue enviada correctamente.</p>
        {visible ? (
          <div className="bg-teal-50 rounded-lg p-4 mb-4">
            <p className="text-2xl font-bold text-teal-900">{notaEscalada.toFixed(2)} / {escala}</p>
            <p className="text-xs text-teal-500">{pendientesAbiertas > 0 ? "Nota provisional, faltan preguntas abiertas por calificar" : "Nota final"}</p>
          </div>
        ) : (
          <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-4 flex items-center justify-center gap-2 text-amber-700">
            <EyeOff className="w-5 h-5" /><p className="text-sm">El docente publicará los resultados una vez todos hayan presentado.</p>
          </div>
        )}
        <button onClick={onDone} className="w-full bg-teal-800 text-white rounded-lg py-2.5 font-medium hover:bg-teal-900">Volver</button>
        <CreatorFooter />
      </div>
    </div>
  );
}


const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
