<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma de Evaluaciones - Universidad de Cartagena</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--p:#a63c24;--pd:#7a2a18;--pl:#fcefd6;--bg:#faf6ef;--gold:#e79d19;--tx:#0f172a;--mu:#64748b;--bd:#cbd5e1;--ok:#15803d;--er:#b91c1c;--wa:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header.top{background:#fff;color:var(--pd);border-top:6px solid var(--p);border-bottom:5px solid var(--gold);padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 6px rgba(0,0,0,.08)}
header.top img.logo{height:56px;width:auto}
header.top h1{font-size:18px;margin:0;flex:1;min-width:200px}
header.top small{color:var(--mu);display:block;font-weight:400;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2,.card h3{margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
label.f{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p);border-color:var(--p)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;color:var(--tx)}
button:hover{background:#f1f5f9}
button.pr{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
button.pr:hover{background:var(--pd)}
button.dg{color:var(--er);border-color:#fecaca}
button.sm{padding:3px 8px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.c-ok{background:#dcfce7;color:var(--ok)}.c-wa{background:#fef3c7;color:var(--wa)}.c-er{background:#fee2e2;color:var(--er)}.c-mu{background:#e2e8f0;color:#475569}.c-in{background:var(--pl);color:var(--pd)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:2px solid var(--pl)}
.tabs button{border:none;border-radius:8px 8px 0 0;background:none;padding:9px 14px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--p);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
th{background:#f1f5f9;font-size:12px;color:var(--mu);text-transform:uppercase}
tr.cl:hover{background:#fdf6e8;cursor:pointer}
.mu{color:var(--mu);font-size:13px}
.qcard{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;background:#fffdf9}
.qh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pv{background:#f8fafc;border:1px dashed var(--bd);border-radius:8px;padding:6px 10px;margin-top:4px;min-height:24px;font-size:15px}
.opt{display:flex;gap:6px;align-items:center;margin:5px 0}.opt input[type=text]{flex:1}
.opt .pv{flex:1;margin:0;padding:3px 8px}
.ex-top{position:sticky;top:0;z-index:20;background:var(--pd);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ex-top h2{font-size:16px;margin:0;flex:1}
.timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);padding:2px 12px;border-radius:8px}
.timer.low{background:var(--er);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.nav button{width:38px;height:38px;padding:0;font-weight:700}
.nav button.ans{background:var(--pl);border-color:var(--p)}.nav button.cur{background:var(--p);color:#fff}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;margin:7px 0;border-radius:10px;border:2px solid var(--bd);background:#fff}
.ch.sel{border-color:var(--p);background:var(--pl)}
.ch b{min-width:24px;height:24px;border-radius:50%;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.ch.sel b{background:var(--p);color:#fff}
body.cap #app{visibility:hidden}body.cap::before{content:'Contenido oculto: vuelve a esta ventana para continuar el examen';position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:600 18px system-ui;color:#7a2a18;background:#faf6ef;z-index:9999}@media print{body.cap #app{visibility:hidden}#app{display:none}}.noselect{user-select:none;-webkit-user-select:none}.noselect input,.noselect textarea,.noselect select{user-select:text;-webkit-user-select:text}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.md{background:#fff;border-radius:14px;padding:18px;max-width:760px;width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:var(--pd);color:#fff;padding:9px 16px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#toast div.er{background:var(--er)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:98;font-weight:700;color:var(--pd)}
.demo{background:#fef3c7;color:#92400e;padding:6px 14px;font-size:13px;text-align:center}
.warn{background:#fee2e2;color:var(--er);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-weight:600}
img.qi{max-width:100%;max-height:340px;border-radius:8px;margin:8px 0}
.pickrow{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px solid #e2e8f0;cursor:pointer}
.katex-display{overflow-x:auto;overflow-y:hidden}
@media(max-width:600px){main{padding:10px}.ex-top h2{flex-basis:100%}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
/* ===== NUCLEO COMPARTIDO (Apps Script y modo demo) ===== */
var ESQUEMA = {
  Cursos: ['id', 'nombre', 'descripcion', 'creado'],
  Estudiantes: ['codigo', 'nombre', 'curso', 'correo', 'salt', 'hash', 'fallos', 'bloqueo'],
  Examenes: ['id', 'cursoId', 'titulo', 'descripcion', 'duracion', 'inicio', 'fin', 'estado', 'aleatorio', 'mostrarNota', 'intentos', 'cortarEnFin', 'preguntas', 'actualizado', 'sinRetroceso'],
  Docente: ['campo', 'valor'],
  Banco: ['id', 'cursoId', 'tipo', 'etiqueta', 'pregunta', 'actualizado'],
  Intentos: ['id', 'examenId', 'codigo', 'nombre', 'curso', 'inicio', 'deadline', 'fin', 'estado', 'respuestas', 'puntajes', 'puntaje', 'total', 'nota', 'salidas', 'pendientes', 'semilla']
};
var NOTA_MAX = 5, GRACIA = 25000, TIPOS = ['mc', 'vf', 'num', 'abierta', 'empareja'], MAX_FALLOS = 5, BLOQUEO_MIN = 5, MIN_CLAVE = 6;
function S(v) { return v == null ? '' : String(v).trim(); }
function codN(v) { return S(v).replace(/[^0-9A-Za-z]/g, '').toLowerCase(); }
function B(v) { return v === true || v === 1 || /^(true|1|si|sí)$/i.test(S(v)); }
function N(v, d) { var x = Number(v); return (S(v) !== '' && isFinite(x)) ? x : (d || 0); }
function J(v, d) { if (v === '' || v == null) return d; if (typeof v === 'object') return v; try { return JSON.parse(v); } catch (e) { return d; } }
function R2(x) { return Math.round(x * 100) / 100; }
function rng(seed) {
  var h = 1779033703 ^ seed.length, i;
  for (i = 0; i < seed.length; i++) { h = Math.imul(h ^ seed.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909);
  var a = (h ^= h >>> 16) >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function perm(n, seed) { var r = rng(String(seed)), p = [], i, j, t; for (i = 0; i < n; i++) p.push(i); for (i = n - 1; i > 0; i--) { j = Math.floor(r() * (i + 1)); t = p[i]; p[i] = p[j]; p[j] = t; } return p; }
function nuevoId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ----- SHA-256 en JS puro (igual en Apps Script y en el navegador) ----- */
function utf8(s) {
  var o = '', i, c;
  for (i = 0; i < s.length; i++) {
    c = s.charCodeAt(i);
    if (c >= 0xD800 && c < 0xDC00 && i + 1 < s.length) c = 0x10000 + ((c - 0xD800) << 10) + (s.charCodeAt(++i) - 0xDC00);
    if (c < 128) o += String.fromCharCode(c);
    else if (c < 2048) o += String.fromCharCode(192 | c >> 6, 128 | c & 63);
    else if (c < 65536) o += String.fromCharCode(224 | c >> 12, 128 | c >> 6 & 63, 128 | c & 63);
    else o += String.fromCharCode(240 | c >> 18, 128 | c >> 12 & 63, 128 | c >> 6 & 63, 128 | c & 63);
  }
  return o;
}
function ror(v, n) { return (v >>> n) | (v << (32 - n)); }
function sha256(msg) {
  var K = sha256.K, H0 = sha256.H, i, j, c, p;
  if (!K) {
    K = sha256.K = []; H0 = sha256.H = [];
    for (p = 0, c = 2; p < 64; c++) {
      for (j = 2; j * j <= c && c % j; j++);
      if (j * j > c) { if (p < 8) H0[p] = (Math.pow(c, 0.5) % 1) * 4294967296 | 0; K[p++] = (Math.pow(c, 1 / 3) % 1) * 4294967296 | 0; }
    }
  }
  var b = utf8(String(msg)), l = b.length, w = [], n = (((l + 8) >> 6) + 1) * 16, h = H0.slice();
  for (i = 0; i < l; i++) w[i >> 2] |= b.charCodeAt(i) << (24 - (i % 4) * 8);
  w[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
  for (i = 0; i < n; i++) w[i] = w[i] | 0;
  w[n - 1] = l * 8;
  for (var o = 0; o < n; o += 16) {
    var x = w.slice(o, o + 16);
    for (i = 16; i < 64; i++) { var s0 = ror(x[i - 15], 7) ^ ror(x[i - 15], 18) ^ (x[i - 15] >>> 3), s1 = ror(x[i - 2], 17) ^ ror(x[i - 2], 19) ^ (x[i - 2] >>> 10); x[i] = (x[i - 16] + s0 + x[i - 7] + s1) | 0; }
    var a = h[0], bb = h[1], cc = h[2], d = h[3], e = h[4], f = h[5], g = h[6], hh = h[7];
    for (i = 0; i < 64; i++) {
      var t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + x[i]) | 0, t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & bb) ^ (a & cc) ^ (bb & cc))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = bb; bb = a; a = (t1 + t2) | 0;
    }
    h[0] = (h[0] + a) | 0; h[1] = (h[1] + bb) | 0; h[2] = (h[2] + cc) | 0; h[3] = (h[3] + d) | 0; h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
  }
  return h.map(function (v) { return ('00000000' + (v >>> 0).toString(16)).slice(-8); }).join('');
}
function hashClave(salt, clave) { var h = sha256(salt + '|' + clave), i; for (i = 0; i < 300; i++) h = sha256(h + salt); return 'h' + h; }
function tokenDe(e) { return sha256(codN(e.codigo) + '|' + e.hash + '|tk').slice(0, 40); }

/* ----- filas <-> objetos ----- */
function cuFila(r) { return { id: S(r.id), nombre: S(r.nombre), descripcion: S(r.descripcion), creado: N(r.creado) }; }
function estFila(r) { return { codigo: S(r.codigo), nombre: S(r.nombre), curso: S(r.curso), correo: S(r.correo), salt: S(r.salt), hash: S(r.hash), fallos: N(r.fallos), bloqueo: N(r.bloqueo) }; }
function estPub(e) { return { codigo: e.codigo, nombre: e.nombre, curso: e.curso, correo: e.correo, tienePass: !!e.hash }; }
function exFila(r) {
  return { id: S(r.id), cursoId: S(r.cursoId), titulo: S(r.titulo), descripcion: S(r.descripcion), duracion: N(r.duracion), inicio: N(r.inicio), fin: N(r.fin), estado: S(r.estado) || 'borrador', aleatorio: B(r.aleatorio), mostrarNota: B(r.mostrarNota), intentos: N(r.intentos, 1) || 1, cortarEnFin: B(r.cortarEnFin), sinRetroceso: B(r.sinRetroceso), preguntas: J(r.preguntas, []), actualizado: N(r.actualizado) };
}
function exAFila(e) { var o = {}; for (var k in e) o[k] = e[k]; o.preguntas = JSON.stringify(e.preguntas || []); return o; }
function bcFila(r) { return { id: S(r.id), cursoId: S(r.cursoId), tipo: S(r.tipo), etiqueta: S(r.etiqueta), pregunta: J(r.pregunta, {}), actualizado: N(r.actualizado) }; }
function bcAFila(b) { var o = {}; for (var k in b) o[k] = b[k]; o.pregunta = JSON.stringify(b.pregunta || {}); return o; }
function intFila(r) {
  return { id: S(r.id), examenId: S(r.examenId), codigo: S(r.codigo), nombre: S(r.nombre), curso: S(r.curso), inicio: N(r.inicio), deadline: N(r.deadline), fin: N(r.fin), estado: S(r.estado), respuestas: J(r.respuestas, {}), puntajes: J(r.puntajes, {}), puntaje: N(r.puntaje), total: N(r.total), nota: N(r.nota), salidas: N(r.salidas), pendientes: B(r.pendientes), semilla: S(r.semilla) };
}
function intAFila(i) { var o = {}; for (var k in i) o[k] = i[k]; o.respuestas = JSON.stringify(i.respuestas || {}); o.puntajes = JSON.stringify(i.puntajes || {}); return o; }
function ventana(e, now) { if (e.inicio && now < e.inicio) return 'proximo'; if (e.fin && now > e.fin) return 'cerrado'; return 'abierto'; }
function cursoPorId(db, id) { var l = db.all('Cursos'); for (var i = 0; i < l.length; i++) if (S(l[i].id) === S(id)) return cuFila(l[i]); return null; }
function mismoCurso(a, b) { return S(a).toLowerCase() === S(b).toLowerCase() && S(a) !== ''; }

/* ----- calificacion ----- */
function numVal(a) { var t = S(a).replace(',', '.').replace(/\s/g, ''), m = t.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/); if (m) return Number(m[1]) / Number(m[2]); return t === '' ? NaN : Number(t); }
function calificar(ex, resp, semilla, prev) {
  var det = {}, sum = 0, tot = 0, pend = false;
  resp = resp || {};
  ex.preguntas.forEach(function (q) {
    var p = N(q.puntos, 1), a = resp[q.id], g = 0, pe = false, pv = prev && prev[q.id], man;
    tot += p;
    if (q.tipo === 'mc') g = (a !== undefined && a !== null && a !== '' && Number(a) === Number(q.correcta)) ? p : 0;
    else if (q.tipo === 'vf') g = ((a === true || a === false) && a === B(q.correcta)) ? p : 0;
    else if (q.tipo === 'num') { var x = numVal(a), c = numVal(q.correcta); g = (isFinite(x) && isFinite(c) && Math.abs(x - c) <= N(q.tolerancia) + 1e-9) ? p : 0; }
    else if (q.tipo === 'empareja') {
      var n = (q.pares || []).length, pm = perm(n, semilla + '|' + q.id), ok = 0;
      if (Array.isArray(a)) for (var i = 0; i < n; i++) if (a[i] !== null && a[i] !== undefined && a[i] !== '' && pm[Number(a[i])] === i) ok++;
      g = n ? p * ok / n : 0;
    } else if (q.tipo === 'abierta') {
      if (pv && pv.manual !== undefined && pv.manual !== null) { man = Math.min(p, Math.max(0, N(pv.manual))); g = man; }
      else { g = 0; pe = S(a) !== ''; }
    }
    g = R2(g); sum += g; if (pe) pend = true;
    det[q.id] = { got: g, max: p, pend: pe }; if (man !== undefined) det[q.id].manual = man;
  });
  return { det: det, puntaje: R2(sum), total: tot, pend: pend, nota: tot ? Math.round(sum / tot * NOTA_MAX * 10) / 10 : 0 };
}
function paraEstudiante(ex, it) {
  return {
    id: ex.id, titulo: ex.titulo, descripcion: ex.descripcion, duracion: ex.duracion, aleatorio: ex.aleatorio, sinRetroceso: ex.sinRetroceso,
    preguntas: ex.preguntas.map(function (q) {
      var o = { id: q.id, tipo: q.tipo, enunciado: q.enunciado, puntos: N(q.puntos, 1), imagen: q.imagen || '' };
      if (q.tipo === 'mc') o.opciones = q.opciones;
      if (q.tipo === 'empareja') { var pm = perm(q.pares.length, it.semilla + '|' + q.id); o.izq = q.pares.map(function (p) { return p[0]; }); o.der = pm.map(function (i) { return q.pares[i][1]; }); }
      return o;
    })
  };
}
function buscarEx(db, id, cache) { if (!cache.l) cache.l = db.all('Examenes').map(exFila); for (var i = 0; i < cache.l.length; i++) if (cache.l[i].id === id) return cache.l[i]; return null; }
function finaliza(db, it, ex, resp, fin) {
  var c = calificar(ex, resp, it.semilla, it.puntajes);
  it.respuestas = resp || {}; it.puntajes = c.det; it.puntaje = c.puntaje; it.total = c.total; it.nota = c.nota; it.pendientes = c.pend; it.estado = 'enviado'; it.fin = fin;
  db.upsert('Intentos', 'id', intAFila(it));
}
function cierraVencidos(db, now) {
  var cache = {};
  db.all('Intentos').map(intFila).forEach(function (it) {
    if (it.estado === 'en curso' && it.deadline + GRACIA < now) { var ex = buscarEx(db, it.examenId, cache); if (ex) finaliza(db, it, ex, it.respuestas, it.deadline); }
  });
}
function buscarEst(db, codigo) { var c = codN(codigo); if (!c) return null; var l = db.all('Estudiantes'); for (var i = 0; i < l.length; i++) if (codN(l[i].codigo) === c) return estFila(l[i]); return null; }
function resumenInt(ex, it) { var o = { id: it.id, estado: it.estado }; if (it.estado === 'enviado' && ex.mostrarNota) { o.nota = it.nota; o.puntaje = it.puntaje; o.total = it.total; o.pendientes = it.pendientes; } return o; }

function perfilDoc(db) {
  var p = { nombre: 'Deivinso Villa Moncaris', correo: 'dvillam2@unicartagena.edu.co', cargo: 'Docente de cátedra', institucion: 'Universidad de Cartagena', telefono: '' };
  db.all('Docente').forEach(function (r) { var k = S(r.campo); if (k in p) p[k] = S(r.valor); });
  return p;
}
/* ----- validacion ----- */
function validarPregunta(q, n, ids) {
  if (TIPOS.indexOf(q.tipo) < 0) throw new Error(n + 'tipo no válido');
  if (!S(q.enunciado)) throw new Error(n + 'falta el enunciado');
  if (!q.id || (ids && ids[q.id])) q.id = nuevoId('q'); if (ids) ids[q.id] = 1;
  q.puntos = N(q.puntos, 1); if (q.puntos <= 0) throw new Error(n + 'los puntos deben ser mayores que 0');
  if (q.imagen && !/^https?:\/\//i.test(S(q.imagen))) throw new Error(n + 'la imagen debe ser un enlace http(s)');
  if (q.tipo === 'mc') {
    q.opciones = (q.opciones || []).map(S); if (q.opciones.length < 2 || q.opciones.some(function (o) { return !o; })) throw new Error(n + 'completa al menos dos opciones (sin vacías)');
    q.correcta = N(q.correcta); if (q.correcta < 0 || q.correcta >= q.opciones.length) throw new Error(n + 'marca la opción correcta');

function corrTxt(q) {

function exportaExcel() {

function leerEstudiantes(file) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = function () { rej(new Error('No se pudo leer el archivo')); };
    fr.onload = function () {
      try {
        var wb = XLSX.read(fr.result, { type: 'array' }), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
        var norm = function (s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
        var head = (rows[0] || []).map(norm), ic = -1, inn = [], imail = -1, tieneHead = head.some(function (h) { return /cod|ced|docum|ident|nombre|apellid|correo|mail/.test(h); });
        if (tieneHead) { head.forEach(function (h, k) { if (ic < 0 && /cod|ced|docum|ident|^id$|^cc$/.test(h)) ic = k; else if (/nombre|apellid|estudiante|alumno/.test(h)) inn.push(k); else if (imail < 0 && /correo|mail/.test(h)) imail = k; }); rows = rows.slice(1); }
        else { ic = 0; inn = [1]; imail = 2; }
        if (ic < 0 || !inn.length) throw new Error('No encontré las columnas de código y nombre');
        res(rows.map(function (r) { return { codigo: String(r[ic] || '').trim(), nombre: inn.map(function (k) { return String(r[k] || '').trim(); }).filter(Boolean).join(' '), correo: imail >= 0 ? String(r[imail] || '').trim() : '' }; }).filter(function (r) { return r.codigo && r.nombre; }));
      } catch (e) { rej(e); }
    };
    fr.readAsArrayBuffer(file);
  });
}

  async subeEst(t) { var m = t.dataset.m, r = await llamar('adm_estudiantes', { cursoId: ST.cursoId, modo: m, lista: ST.cargaEst }); if (r.ok) { toast('Lista guardada: ' + r.total + ' estudiantes' + (r.movidos ? ' (' + r.movidos + ' venían de otro curso)' : '')); ST.cargaEst = null; cargaDatos(); } },
  cancelEd() { ST.edit = null; render(); },
  async guardaEd() {
    var E = copia(ST.edit), r;
    if (E.kind === 'banco') { r = await llamar('adm_guardarPreguntas', { cursoId: E.cursoId, items: [{ id: E.id, etiqueta: E.etiqueta || '', pregunta: E.preguntas[0] }] }); if (r.ok) { toast('Pregunta guardada en el banco'); ST.edit = null; ST.bancoCurso = ''; cargaDatos(); } return; }
    r = await llamar('adm_guardarExamen', { examen: E }); if (r.ok) { toast('Sesión guardada'); ST.edit = null; cargaDatos(); }
  },
  addQ(t) { ST.edit.preguntas.push(qNueva(t.dataset.t)); render(); },
  delQ(t) { if (confirm('¿Eliminar esta pregunta?')) { ST.edit.preguntas.splice(Number(t.dataset.i), 1); render(); } },
  dupQ(t) { var i = Number(t.dataset.i), q = copia(ST.edit.preguntas[i]); q.id = idq(); ST.edit.preguntas.splice(i + 1, 0, q); render(); },
  mvQ(t) { var i = Number(t.dataset.i), d = Number(t.dataset.d), l = ST.edit.preguntas; if (i + d < 0 || i + d >= l.length) return; var x = l[i]; l[i] = l[i + d]; l[i + d] = x; render(); },
  addOp(t) { var q = ST.edit.preguntas[Number(t.dataset.i)]; if (q.opciones.length < 8) { q.opciones.push(''); render(); } },
  delOp(t) { var q = ST.edit.preguntas[Number(t.dataset.i)], k = Number(t.dataset.k); if (q.opciones.length <= 2) return toast('Mínimo 2 opciones', true); q.opciones.splice(k, 1); if (Number(q.correcta) >= q.opciones.length || Number(q.correcta) === k) q.correcta = 0; render(); },
  addPar(t) { ST.edit.preguntas[Number(t.dataset.i)].pares.push(['', '']); render(); },
  delPar(t) { var q = ST.edit.preguntas[Number(t.dataset.i)]; if (q.pares.length <= 2) return toast('Mínimo 2 parejas', true); q.pares.splice(Number(t.dataset.k), 1); render(); },
  nuevaPB(t) { ST.edit = { kind: 'banco', id: '', cursoId: ST.cursoId, etiqueta: '', preguntas: [qNueva(t.dataset.t)] }; render(); window.scrollTo(0, 0); },
  editPB(t) { var b = ST.banco.filter(function (x) { return x.id === t.dataset.id; })[0]; ST.edit = { kind: 'banco', id: b.id, cursoId: b.cursoId, etiqueta: b.etiqueta, preguntas: [copia(b.pregunta)] }; render(); window.scrollTo(0, 0); },
  async delPB(t) { if (!confirm('¿Eliminar esta pregunta del banco? (Las sesiones que ya la usan conservan su copia.)')) return; var r = await llamar('adm_eliminarPreguntas', { ids: [t.dataset.id] }); if (r.ok) { toast('Pregunta eliminada'); ST.bancoCurso = ''; await cargaDatos(); } },
  async alBanco(t) { var q = ST.edit.preguntas[Number(t.dataset.i)], et = prompt('Tema o etiqueta para el banco (opcional):', ''); if (et === null) return; var r = await llamar('adm_guardarPreguntas', { cursoId: ST.edit.cursoId, items: [{ etiqueta: et, pregunta: copia(q) }] }); if (r.ok) { toast('Guardada en el banco del curso'); ST.bancoCurso = ''; ST.datos.bancoN[ST.edit.cursoId] = (ST.datos.bancoN[ST.edit.cursoId] || 0) + 1; } },
  async abrePick() { if (ST.bancoCurso !== ST.edit.cursoId) await cargaBanco(ST.edit.cursoId); if (!ST.banco.length) return toast('El banco de este curso está vacío todavía', true); ST.pick = { sel: {}, q: '', t: '', e: '', n: 5 }; ST.modal = modalPick(); render(); },
  pickAdd() { var ids = Object.keys(ST.pick.sel).filter(function (k) { return ST.pick.sel[k]; }); agregaDelBanco(ST.banco.filter(function (b) { return ids.indexOf(b.id) >= 0; })); },
  pickRand() { var l = pickLista().slice(), i, j, t; for (i = l.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = l[i]; l[i] = l[j]; l[j] = t; } agregaDelBanco(l.slice(0, Math.max(1, Number(ST.pick.n) || 1))); }
};
async function cargaResultados(id) { var r = await llamar('adm_resultados', { examenId: id }); if (r.ok) { ST.res = r; ST.ctab = 'res'; render(); } }

/* ===================== EVENTOS ===================== */
document.addEventListener('click', function (e) { var t = e.target.closest('[data-act]'); if (!t || t.disabled) return; var f = ACT[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('input', function (e) {
  var t = e.target, ex = ST.ex;
  if (t.dataset.inp && ex && ST.vista === 'exam') {
    var q = ex.examen.preguntas[ex.orden[ex.cur]];
    if (t.dataset.inp === 'emp') { var a = Array.isArray(ex.resp[q.id]) ? ex.resp[q.id].slice() : q.izq.map(function () { return ''; }); a[Number(t.dataset.i)] = t.value === '' ? '' : Number(t.value); ex.resp[q.id] = a; } else ex.resp[q.id] = t.value;
    guardaLocal(); var nb = document.querySelector('.nav button.cur'); if (nb) nb.classList.toggle('ans', respondida(q)); return;
  }
  if (t.id === 'bEst') { ST.filtroEst = t.value; rerender(); return; }
  if (t.dataset.bf) { ST.bf[t.dataset.bf] = t.value; rerender(); return; }
  if (t.dataset.pk && ST.pick) { if (t.dataset.pk === 'n') { ST.pick.n = Number(t.value) || 1; return; } ST.pick[t.dataset.pk] = t.value; ST.modal = modalPick(); rerender(); return; }
  if (t.dataset.m && ST.edit) {
    var m = t.dataset.m.split(':'), E = ST.edit, v = t.type === 'checkbox' ? t.checked : t.value;
    if (m[0] === 'f') { if (m[1] === 'publicado') E.estado = v ? 'publicado' : 'borrador'; else if (t.type === 'datetime-local') E[m[1]] = delLocalInput(v); else if (t.type === 'number') E[m[1]] = Number(v) || 0; else E[m[1]] = v; }
    else if (m[0] === 'q') E.preguntas[+m[1]][m[2]] = t.type === 'number' ? (v === '' ? 0 : Number(v)) : v;
    else if (m[0] === 'o') E.preguntas[+m[1]].opciones[+m[2]] = v;
    else if (m[0] === 'p') E.preguntas[+m[1]].pares[+m[2]][+m[3]] = v;
    if (t.dataset.pv) { var el = $(t.dataset.pv); if (el) el.innerHTML = rich(v); }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.c && ST.edit) { var p = t.dataset.c.split(':'), q = ST.edit.preguntas[+p[0]]; q.correcta = p[1] === 'v' ? true : p[1] === 'f' ? false : Number(p[1]); }
  if (t.dataset.pick && ST.pick) { ST.pick.sel[t.dataset.pick] = t.checked; var n = Object.keys(ST.pick.sel).filter(function (k) { return ST.pick.sel[k]; }).length, b = document.querySelector('[data-act=pickAdd]'); if (b) { b.textContent = 'Agregar seleccionadas (' + n + ')'; b.disabled = !n; } }
  if (t.id === 'fileEst' && t.files[0]) leerEstudiantes(t.files[0]).then(function (l) { ST.cargaEst = l; $('prevEst').innerHTML = '<div class="warn" style="background:#ecfdf5;color:#065f46;margin-top:10px">Se leyeron <b>' + l.length + '</b> estudiantes para el curso <b>' + esc(cursoActual().nombre) + '</b>.<div class="row" style="margin-top:8px"><button class="pr" data-act="subeEst" data-m="agregar">Agregar a la lista actual</button><button class="dg" data-act="subeEst" data-m="reemplazar">Reemplazar la lista de este curso</button></div></div>'; }).catch(function (er) { toast(er.message, true); });
  if (t.id === 'selRes' && t.value) cargaResultados(t.value);
});
document.addEventListener('visibilitychange', function () { if (document.hidden) registraSalida('cambio de pestaña'); });
window.addEventListener('blur', function () { if (ST.vista === 'exam') setTimeout(function () { if (!document.hasFocus()) registraSalida('ventana sin foco'); }, 300); });
document.addEventListener('fullscreenchange', function () { if (ST.vista === 'exam' && !document.fullscreenElement && ST.ex && !ST.ex.enviando) { registraSalida('salió de pantalla completa'); if (!ST.modal) { ST.modal = '<h3>Volver a pantalla completa</h3><p>Saliste de la pantalla completa. Esto queda registrado.</p><button class="pr" data-act="volverFS">Continuar el examen</button>'; render(); } } });
ACT.volverFS = async function () { ST.modal = ''; render(); try { await document.documentElement.requestFullscreen(); } catch (e) { } };
['copy', 'cut', 'paste', 'contextmenu'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (ST.vista === 'exam' && !/INPUT|TEXTAREA/.test(e.target.tagName)) e.preventDefault(); }); });
/* anti-captura: disuasivo (no existe bloqueo real en un navegador) */
(function () {
  function ocultar(ms) { document.body.classList.add('cap'); setTimeout(function () { if (document.hasFocus()) document.body.classList.remove('cap'); }, ms); }
  function intento(m) { ocultar(2500); registraSalida(m); try { navigator.clipboard.writeText('Captura no permitida durante el examen'); } catch (e) { } }
  document.addEventListener('keyup', function (e) { if (ST.vista === 'exam' && (e.key === 'PrintScreen' || e.code === 'PrintScreen')) intento('intento de captura de pantalla'); });
  document.addEventListener('keydown', function (e) {
    if (ST.vista !== 'exam') return;
    var k = (e.key || '').toLowerCase();
    var win = e.metaKey && e.shiftKey && k === 's';
    var mac = e.metaKey && e.shiftKey && /^Digit[345]$/.test(e.code || '');
    var imp = (e.ctrlKey || e.metaKey) && (k === 'p' || k === 's');
    if (win || mac || imp) { e.preventDefault(); intento('intento de captura o impresión'); }
  });
  window.addEventListener('blur', function () { if (ST.vista === 'exam') document.body.classList.add('cap'); });
  window.addEventListener('focus', function () { document.body.classList.remove('cap'); });
  document.addEventListener('visibilitychange', function () { if (ST.vista === 'exam') { if (document.hidden) document.body.classList.add('cap'); else if (document.hasFocus()) document.body.classList.remove('cap'); } });
  window.addEventListener('beforeprint', function () { if (ST.vista === 'exam') document.body.classList.add('cap'); });
  window.addEventListener('afterprint', function () { document.body.classList.remove('cap'); });
})();
window.addEventListener('beforeunload', function (e) { if (ST.vista === 'exam') { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || ST.vista !== 'home') return;
  var id = e.target.id; if (id === 'cod') ACT.lgContinuar(); else if (id === 'pw') ACT.lgEntrar(); else if (id === 'pw1' || id === 'pw2') ACT.lgCrear(); else if (id === 'clave') ACT.loginDoc();
});
if (DEMO) sembrarDemo();
render();
window.addEventListener('load', function () { if (ST.vista === 'home') render(); });
(async function () {
  try { var s = JSON.parse(sessionStorage.getItem('pe_sess') || 'null'); if (!s || !s.c) return; ST.est = { codigo: s.c }; ST.token = s.t; var r = await api('lista'); if (r.ok) entra(r, false); else { ST.est = null; ST.token = ''; sessionStorage.removeItem('pe_sess'); } } catch (e) { }
})();
</script>
